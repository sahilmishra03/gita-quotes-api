<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - gitaquotes API</title>
    <meta name="description" content="gitaquotes API web portal is undergoing brief scheduled maintenance. Core API endpoints remain operational.">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        :root {
            --bg-base: #050505;
            --surface: #0f0f11;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8f9fa;
            --text-secondary: #a1a1aa;
            --accent-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Subtle ambient glow behind the minimal card */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(5, 5, 5, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .minimal-card {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            background: rgba(15, 15, 17, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1.75rem auto;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 5px rgba(74, 222, 128, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 1.5rem;
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent-gold);
        }

        @media (max-width: 480px) {
            .minimal-card {
                padding: 2.25rem 1.5rem;
            }
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <div class="minimal-card">
        <div class="icon-wrapper">
            <i class="ti ti-om"></i>
        </div>

        <h1 class="title">We'll Be Right Back</h1>
        <p class="description">
            The gitaquotes API portal is currently undergoing brief scheduled maintenance to upgrade our systems. We will return shortly.
        </p>

        <div>
            <span class="status-pill">
                <span class="pulse-dot"></span> Core API Endpoints Operational
            </span>
        </div>

        <div class="divider"></div>

        <div class="footer-links">
            <a href="https://github.com/sahilmishra03/gita-quotes-api" target="_blank" rel="noopener noreferrer">
                <i class="ti ti-brand-github"></i> GitHub Repository
            </a>
            <a href="https://gita-quotes-api.onrender.com/api/v1/languages" target="_blank" rel="noopener noreferrer">
                <i class="ti ti-server"></i> API Status
            </a>
        </div>
    </div>
</body>

</html>
